num_agents: 2
num_rounds: 1000

num_classes: 28
num_modalities: 2

hedge:
  eta: 0.05
  min_weight: 0.001
  temperature: 1.0
  loss: nll

use_baseline: true     # true => ignore attention, use B0 only
use_attention: true        # true => compare B0 vs M1, false => use B0 only
log_attention: false         # set true if you also log attention weights later

date: 2025-08-15